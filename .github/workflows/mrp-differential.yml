name: mrp differential

# PR Validation gates every PR on the e2e suite, mrp differential included.
# This reruns it weekly (and on demand) on one runner against the pinned Martian
# commit and the latest Nextflow, so a divergence or a Nextflow deprecation
# surfaces during quiet periods rather than at the next PR.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mrp-diff:
    name: mrp differential (real Martian)
    runs-on: ubuntu-latest
    # Budget for the WHOLE job — toolchain setup + Martian clone/build on a
    # cache miss (~5 min) + `make test-e2e` unsharded, mrp differential
    # included. 60 keeps wide headroom while still killing a genuine hang
    # before the 30-minute go-test timeout could repeat.
    timeout-minutes: 60
    env:
      E2E_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/setup-martian
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: nf-core/setup-nextflow@v3 # latest Nextflow, deliberately unpinned
      - name: Golden suite + differential vs real mrp
        run: make test-e2e
