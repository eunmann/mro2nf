name: PR Validation

# Docs-only changes (markdown, docs/, the agent skills, LICENSE) can't affect
# anything CI measures, so they skip the heavy jobs. This workflow is the ONLY
# source of the seven required contexts (#280): a second workflow posting the
# same names lets branch protection accept its success before the real job
# reports. TestRequiredContexts* guards that.
on:
  # PRs only. Branch protection squash-merges a PR only once it is up to date
  # with main, so the merged tree is the tree the PR's run validated and a push
  # run would repeat it. release.yml releases only a commit whose tree a PR run
  # validated, and the nightly tier reruns the suites on main.
  #
  # No path or branch filter: every PR must run this workflow so its required
  # contexts always report. A workflow that doesn't trigger reports nothing,
  # and a required context that never reports deadlocks the PR (#182). Any
  # base branch, so stacked PRs are validated too.
  pull_request:

permissions:
  contents: read

# The Temurin LTS the Nextflow driver runs on; Nextflow 26.04 supports Java
# 17 up to 26 (#237).
env:
  JAVA_VERSION: "25"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every required job carries the same gate:
#   needs: changes
#   if: ${{ <status> && !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false') }}
# It skips only on a successful docs-only verdict, and GitHub counts a job
# skipped by `if:` as a passing required check. The explicit status function
# (`!cancelled()`, or `always()` for the e2e aggregate) replaces the implicit
# success(): without it a FAILED `changes` job would skip every required job,
# and those skips would pass branch protection. With it, a failed `changes`
# runs full validation.
jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # fetch-depth 2: a pull_request checkout is the PR's merge commit, and
      # its first parent is the base tip the PR merges into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: diff
        run: |
          set -euo pipefail
          git rev-parse -q --verify HEAD^2 >/dev/null || {
            echo "::error::HEAD is not the PR merge commit"; exit 1;
          }
          # --no-renames: a code file renamed into docs/ is still a code
          # deletion. Written to a file so a git failure fails the step.
          git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          code=false
          while IFS= read -r -d '' f; do
            case "$f" in
              *.md | docs/* | .claude/* | LICENSE) ;;
              *) echo "code change: $f"; code=true ;;
            esac
          done < "$RUNNER_TEMP/changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Check for vulnerabilities
        # Pinned so a new govulncheck release (or one needing a newer toolchain)
        # cannot change CI behavior without a repo change.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && govulncheck ./...
      # golangci-lint runs govet, so there is no separate `go vet` step.
      # --build-tags e2e pulls the tag-gated test/e2e harness into the lint
      # set (the tag is additive; nothing else carries an e2e constraint).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --build-tags e2e
      - name: Check for dead code
        # Whole-program reachability from the two binaries; catches orphans
        # golangci's `unused` misses (exported or test-reachable functions).
        run: make deadcode

  build:
    name: Build
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build all packages
        run: go build ./...

  test:
    name: Unit tests
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests (race detector)
        run: go test -race ./...
      - name: Coverage gate
        run: make cover

  # Single source of truth for the E2E shard fan-out: the shard list is defined
  # here once, and E2E_SHARD_TOTAL below is DERIVED from its length — so the
  # matrix and the total can never silently desync (which would drop a fraction
  # of the suite while CI stayed green). The step also asserts the list is the
  # contiguous range 0..N-1 that harness shardSkip's modulo partition requires.
  #
  # NOTE: "Detect code changes", "E2E shard config" and "E2E shard N" are
  # internal contexts. Do NOT mark them required in branch protection: only the
  # seven aggregate contexts are gates, and a docs-only PR skips the shards.
  e2e-config:
    name: E2E shard config
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.set.outputs.shards }}
      total: ${{ steps.set.outputs.total }}
    steps:
      - id: set
        run: |
          shards='[0, 1, 2, 3]'
          total=$(echo "$shards" | jq 'length')
          echo "$shards" | jq -e 'to_entries | all(.key == .value)' >/dev/null \
            || { echo "shard list $shards is not the contiguous range 0..$((total-1))"; exit 1; }
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"

  # Transpiles every fixture, runs it under Nextflow, and diffs the result against
  # the committed real-mrp golden, and (TestMrpDiff) against a live mrp run of
  # the same fixture: published tree, _outs and every stage's _args/_outs.
  #
  # Sharded across runners: every `nextflow run` is a fresh JVM, so the suite is
  # JVM-boot-bound and core-throttled — one runner serializes ~130 runs. The
  # E2E_SHARD_* pair partitions the runs by a stable hash of the subtest name
  # (harness shardSkip), so N runners share the load near-linearly. Full
  # coverage is the union of shards, enforced by the `e2e` gate below. To change
  # the shard count, edit only the e2e-config shard list — the total derives.
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}
    needs: e2e-config
    # Explicit: the implicit success() also checks transitive needs, so a
    # failed `changes` would skip the shards even though e2e-config ran.
    if: ${{ !cancelled() && needs.e2e-config.result == 'success' }}
    runs-on: ubuntu-latest
    # Setup and make test-e2e's 30-minute go-test timeout, with headroom,
    # so a stuck test fails with go test's panic rather than a runner kill.
    timeout-minutes: 40
    strategy:
      fail-fast: false # run every shard so all failures surface in one CI round
      matrix:
        shard: ${{ fromJSON(needs.e2e-config.outputs.shards) }}
    env:
      # The harnesses skip cleanly on a dev box missing a tool, but in CI a
      # missing prerequisite must FAIL the job, not silently pass it.
      E2E_REQUIRE: "1"
      E2E_SHARD_INDEX: ${{ matrix.shard }}
      E2E_SHARD_TOTAL: ${{ needs.e2e-config.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/setup-martian
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Installs and caches the Nextflow binary.
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
      - name: Resolve Nextflow version
        id: nxf
        # setup-nextflow exposes no version output, so read it back; keying the
        # plugin cache on it means a Nextflow bump can't be served stale plugins.
        run: echo "ver=$(nextflow -version 2>&1 | grep -oP 'version \K[0-9.]+')" >> "$GITHUB_OUTPUT"
      - name: Cache Nextflow plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nextflow
          key: nextflow-${{ runner.os }}-${{ steps.nxf.outputs.ver }}
      - run: make test-e2e
      # A failed test keeps its run.log, .nextflow.log, traces and the failed
      # tasks' .command.* logs in artifacts/e2e/ (test/e2e/runlogs_test.go).
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-shard-${{ matrix.shard }}-run-logs
          path: artifacts/e2e/
          if-no-files-found: ignore

  # Stable required branch-protection context aggregating the shards — DO NOT
  # rename (a renamed required check deadlocks every PR). Skipped (passing) only
  # on a docs-only verdict; otherwise green only when every shard is green.
  # always() so it reports a failure, rather than stalling pending, when a
  # shard fails, is cancelled, or never ran because e2e-config failed.
  e2e:
    name: E2E (Nextflow vs mrp goldens)
    runs-on: ubuntu-latest
    needs: [changes, e2e-shard]
    if: ${{ always() && !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false') }}
    steps:
      - name: All E2E shards passed
        run: |
          echo "e2e-shard aggregate result: ${{ needs.e2e-shard.result }}"
          [ "${{ needs.e2e-shard.result }}" = "success" ] || {
            echo "one or more E2E shards did not succeed"; exit 1;
          }

  # Static-parse every generated project with the formal language-server parser
  # (#48): a Groovy syntax error or warning in rarely-run wiring fails here with
  # file/line, before the slower golden runs can miss it. setup-nextflow installs
  # latest (>= 26.04), which the target asserts. Lints every fixture's project
  # once (#295). Its limit is setup and make lint-nf's 25-minute go-test
  # timeout, with headroom, so a stuck lint fails with go test's panic
  # rather than a runner kill.
  lint-nf:
    name: Lint generated Nextflow
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_REQUIRE: "1" # missing prereqs must fail CI, not skip it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
      - name: Resolve Nextflow version
        id: nxf
        run: echo "ver=$(nextflow -version 2>&1 | grep -oP 'version \K[0-9.]+')" >> "$GITHUB_OUTPUT"
      - name: Cache Nextflow plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nextflow
          key: nextflow-${{ runner.os }}-${{ steps.nxf.outputs.ver }}
      - run: make lint-nf

  # Data-plane epic gate (#17/#13): the transfer-multiplier benchmark must not
  # regress vs bench/baseline.json.
  bench:
    name: Bench (data movement gate)
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_REQUIRE: "1" # missing prereqs must fail CI, not skip it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
      - name: Resolve Nextflow version
        id: nxf
        run: echo "ver=$(nextflow -version 2>&1 | grep -oP 'version \K[0-9.]+')" >> "$GITHUB_OUTPUT"
      - name: Cache Nextflow plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nextflow
          key: nextflow-${{ runner.os }}-${{ steps.nxf.outputs.ver }}
      - run: make bench

  # The same pipelines under the generated docker profile, in one image per
  # fixture built FROM the runtime image deploy/runtime/Dockerfile builds,
  # where a task sees only what it stages: the AWS Batch / HealthOmics
  # no-shared-filesystem model. Also the awsbatch profile on local docker and
  # the HealthOmics package. Runs in parallel with the local e2e jobs above.
  e2e-docker:
    name: E2E (container isolation)
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false') }}
    runs-on: ubuntu-latest
    # Setup and make test-e2e-docker's 30-minute go-test timeout, with headroom,
    # so a stuck test fails with go test's panic rather than a runner kill.
    timeout-minutes: 40
    env:
      E2E_REQUIRE: "1" # missing prereqs must fail CI, not skip it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
      - name: Resolve Nextflow version
        id: nxf
        run: echo "ver=$(nextflow -version 2>&1 | grep -oP 'version \K[0-9.]+')" >> "$GITHUB_OUTPUT"
      - name: Cache Nextflow plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nextflow
          key: nextflow-${{ runner.os }}-${{ steps.nxf.outputs.ver }}
      - run: make test-e2e-docker
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-docker-run-logs
          path: artifacts/e2e/
          if-no-files-found: ignore
