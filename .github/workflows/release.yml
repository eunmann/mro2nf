name: release

on:
  push:
    tags: ["v*"]
  # Manual dry run: build the binaries and the runtime image on demand to
  # validate the release pipeline (e.g. after an action bump) WITHOUT publishing
  # a GitHub release or pushing to GHCR. Only a tag push publishes.
  workflow_dispatch:

# Least privilege at the workflow level: only the publish job needs write, and it
# grants itself contents:write below. The build job (untrusted third-party actions
# in the toolchain) and the image job thus run with a read-only token.
permissions:
  contents: read

# A dispatch run is a dry run (no tag to publish against); a tag push is real.
env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Unix targets only: the mre runtime shim drives the Martian adapter ABI
        # (process groups, RSS/prlimit accounting) which is Unix-specific, and the
        # generated pipelines run on Linux backends. Windows is not supported.
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build mro2nf + mre
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          for bin in mro2nf mre; do
            out="${bin}-${{ matrix.goos }}-${{ matrix.goarch }}"
            go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$out" "./cmd/${bin}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            mro2nf-${{ matrix.goos }}-${{ matrix.goarch }}
            mre-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  # A single job publishes the release: the 4 build legs racing to create the
  # same release concurrently is a known flakiness source (duplicate-release
  # 409s in action-gh-release).
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' # dry run builds but never releases
    permissions:
      contents: write # create the GitHub release (only this job needs it)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          merge-multiple: true
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            mro2nf-*
            mre-*
          fail_on_unmatched_files: true

  # Publish the runtime base image (mre + Martian adapters at /opt/mro2nf) to
  # GHCR so users build their pipeline image FROM it instead of vendoring mre.
  # Tagged with the release version + latest, multi-arch (amd64 + arm64).
  image:
    name: Runtime image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # arm64 emulation for the final stage.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.DRY_RUN != 'true' # no registry auth needed to build-without-push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/mro2nf-runtime
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }} # dry run builds the image but does not push
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the tag into `mre version` (a dispatch dry run bakes the branch
          # name, which is fine — the image is never pushed).
          build-args: |
            VERSION=${{ github.ref_name }}
