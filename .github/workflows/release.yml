name: release

on:
  push:
    tags: ["v*"]
  # Manual dry run: build the binaries and the runtime image on demand to
  # validate the release pipeline (e.g. after an action bump) WITHOUT publishing
  # a GitHub release or pushing to GHCR. Only a tag push publishes.
  workflow_dispatch:

# No token scopes by default: each job grants only what it uses, so the build
# job's toolchain never holds a write token.
permissions: {}

env:
  # A dispatch run is a dry run (no tag to publish against); a tag push is real.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
  # A semver pre-release (v1.2.0-rc1) is published but never becomes the
  # latest GitHub release or the image's `latest` tag.
  PRERELEASE: ${{ contains(github.ref_name, '-') }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/mro2nf-runtime

jobs:
  # Publish only what CI validated. PR Validation runs on PRs only, so the
  # tagged commit must be a PR's squash merge with the same tree as the PR's
  # head, and that head must have a green run. A commit pushed past a PR has
  # no such run and cannot be released.
  ci-green:
    name: CI green on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # resolve the tag and compare trees
      pull-requests: read # find the PR that merged the commit
      actions: read # read the PR Validation runs
    steps:
      - name: Require a green PR Validation run on the tagged tree
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
          sha=$(api "commits/refs/tags/$GITHUB_REF_NAME" .sha)
          head=$(api "commits/$sha/pulls" "map(select(.merge_commit_sha == \"$sha\")) | .[0].head.sha // empty")
          [ -n "$head" ] || {
            echo "::error::$sha is not a PR's merge commit: tag a commit that landed through a PR"
            exit 1
          }
          [ "$(api "git/commits/$sha" .tree.sha)" = "$(api "git/commits/$head" .tree.sha)" ] || {
            echo "::error::$sha's tree differs from its PR head $head, so no PR run validated it"
            exit 1
          }
          green=$(api "actions/workflows/pr-validation.yml/runs?head_sha=$head&event=pull_request&status=success" .total_count)
          [ "$green" -gt 0 ] || {
            echo "::error::no successful PR Validation run on $head"
            exit 1
          }

  build:
    needs: ci-green
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # Unix targets only: the mre runtime shim drives the Martian adapter ABI
        # (process groups, RSS/prlimit accounting) which is Unix-specific, and the
        # generated pipelines run on Linux backends. Windows is not supported.
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build cache: it is shared with main-branch jobs that run third-party
      # actions, so a poisoned entry could reach the release binaries.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Static and path-free, as the Makefile's build target explains.
      - name: Build mro2nf + mre
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          for bin in mro2nf mre; do
            out="${bin}-${{ matrix.goos }}-${{ matrix.goarch }}"
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$out" "./cmd/${bin}"
          done
      - name: Check the linux binaries are static
        if: matrix.goos == 'linux'
        run: |
          for bin in mro2nf mre; do
            f="${bin}-linux-${{ matrix.goarch }}"
            file "$f" | grep -q 'statically linked' || { file "$f"; echo "::error::$f is not statically linked"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            mro2nf-${{ matrix.goos }}-${{ matrix.goarch }}
            mre-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  # A single job publishes the release: the 4 build legs racing to create the
  # same release concurrently is a known flakiness source (duplicate-release
  # 409s in action-gh-release).
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' # dry run builds but never releases
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the provenance with a Sigstore certificate
      attestations: write # store the provenance
    steps:
      # The license and third-party notices the binaries' statically linked
      # code requires travel as release assets beside them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            LICENSE
            THIRD_PARTY_NOTICES
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          merge-multiple: true
      - name: Write SHA256SUMS
        run: LC_ALL=C sha256sum mro2nf-* mre-* > SHA256SUMS && cat SHA256SUMS
      # GitHub offers no attestations to private repositories owned by a user
      # account, so the step would fail every release there.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-checksums: SHA256SUMS
      - if: github.event.repository.private
        run: echo "::warning::no build provenance for the binaries or the image; GitHub attestations need a public repository here"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            mro2nf-*
            mre-*
            SHA256SUMS
            LICENSE
            THIRD_PARTY_NOTICES
          fail_on_unmatched_files: true
          prerelease: ${{ env.PRERELEASE }}

  # Publish the runtime image (mre, mrjob and Martian's adapters at
  # /opt/mro2nf) to GHCR: PLAN and OUTS run in it, and a generated project's
  # stage image builds FROM it. Tagged with the release version (+ latest for
  # a non-prerelease), multi-arch (amd64 + arm64).
  image:
    name: Runtime image (GHCR)
    needs: ci-green
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image and its provenance
      id-token: write # sign the provenance with a Sigstore certificate
      attestations: write # store the provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # arm64 emulation for the final stage.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.DRY_RUN != 'true' # no registry auth needed to build-without-push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # latest=false: the default (auto) adds `latest` to every
      # type=ref,event=tag, pre-releases included.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ env.PRERELEASE != 'true' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          file: deploy/runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }} # dry run builds the image but does not push
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the tag into `mre version` (a dispatch dry run bakes the branch
          # name, which is fine — the image is never pushed).
          build-args: |
            VERSION=${{ github.ref_name }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ env.DRY_RUN != 'true' && !github.event.repository.private }}
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
