version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # Batch minor/patch bumps into one PR; majors stay separate for review.
      go-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Deliberately pinned by commit (see CLAUDE.md): upstream's untagged-major
      # tags resolve as +incompatible versions that would "upgrade" the pseudo-
      # version pin to an OLDER release.
      - dependency-name: github.com/martian-lang/martian

  # Every action is pinned by commit SHA with a trailing `# vX.Y.Z` comment;
  # Dependabot bumps the SHA and the comment together. "/" covers only
  # .github/workflows, so the composite actions are listed too.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      # Same policy as gomod: majors arrive individually for review.
      actions-minor-patch:
        update-types: ["minor", "patch"]

  # Base images are pinned as tag@digest; Dependabot moves both. A golang bump
  # must also move go.mod's toolchain line (TestRuntimeBuildGoIsToolchain). A
  # new Go or Python minor is a deliberate upgrade (Python is the interpreter
  # every py stage runs on), so only digest and patch refreshes arrive here.
  - package-ecosystem: docker
    directory: /deploy/runtime
    schedule:
      interval: weekly
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # AWS Batch CDK app. Its package-lock.json is committed, so bumps update the
  # lockfile, and CI (cdk-validation.yml) compiles + synths the app on every
  # bump. versioning-strategy (not lockfile presence) governs package.json:
  # increase-if-necessary rewrites a range only when the new version falls
  # outside it.
  - package-ecosystem: npm
    directory: /deploy/awsbatch-cdk
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    # @types/node majors are pinned to the CI/runner Node major (see
    # cdk-validation.yml's node-version comment): typings ahead of the runtime
    # let tsc pass on APIs the runtime lacks. Bump both together, by hand.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      cdk-minor-patch:
        update-types: ["minor", "patch"]
